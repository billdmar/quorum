\* TLC configuration for the raft safety model.
\* Small, symmetric, bounded so TLC checks the whole reachable state space in
\* seconds. 3 servers is the smallest interesting cluster (quorum = 2); the term
\* and log-length bounds keep the space finite while still exercising multiple
\* elections, log divergence, and the Figure-8 commit rule.
\*
\* Run:  java -cp /tmp/tla2tools.jar tlc2.TLC -config raft.cfg raft.tla
\* Expect: "Model checking completed. No error has been found."

SPECIFICATION Spec

CONSTANTS
    Server = {s1, s2, s3}
    Follower = "follower"
    Candidate = "candidate"
    Leader = "leader"
    Nil = Nil
    MaxTerm = 3
    MaxLogLen = 3

INVARIANT Invariants
